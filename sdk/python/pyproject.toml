[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soroscan"
version = "0.1.0"
description = "Python SDK for the SoroScan API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SoroScan" },
]
keywords = ["soroscan", "stellar", "soroban", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=41.0",
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "urllib3>=1.26.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.22.0",
    "pytest-timeout>=2.1.0",
    "responses>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/SoroScan/soroscan"
Repository = "https://github.com/SoroScan/soroscan"

[project.scripts]
soroscan = "soroscan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soroscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# TODO: pre-existing lint debt, not introduced by the CI workflow added in
# issue #1937. Clean these up and drop the ignores in a follow-up.
"soroscan/__init__.py" = ["I001", "RUF022"]
"soroscan/async_client.py" = ["RUF022"]
"soroscan/builder.py" = ["I001"]
"soroscan/client.py" = ["I001", "F401", "PYI034", "PYI036", "SIM114", "BLE001"]
"soroscan/exceptions.py" = ["I001"]
"soroscan/models.py" = ["F811"]
"soroscan/pagination.py" = ["I001", "UP035", "UP037"]
"soroscan/webhook_verification.py" = ["BLE001"]