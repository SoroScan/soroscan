[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soroscan"
version = "0.1.0"
description = "Python SDK for the SoroScan API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "SoroScan" },
]
keywords = ["soroscan", "stellar", "soroban", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-httpx>=0.22.0",
    "responses>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/SoroScan/soroscan"
Repository = "https://github.com/SoroScan/soroscan"

[tool.setuptools.packages.find]
where = ["."]
include = ["soroscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
