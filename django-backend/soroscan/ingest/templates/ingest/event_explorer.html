{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoroScan Event Explorer - {{ contract_name }}</title>
  <link rel="stylesheet" href="{% static 'ingest/timeline.css' %}" />
</head>
<body>
  <main
    class="timeline-app explorer-app"
    data-contract-id="{{ contract_id }}"
    data-contract-name="{{ contract_name }}"
  >
    <header class="hero">
      <p class="kicker">SoroScan Event Explorer</p>
      <h1>{{ contract_name }}</h1>
      <p class="contract-id">{{ contract_id }}</p>
      <div class="row top-actions">
        <a href="{% url 'contract-timeline' contract_id=contract_id %}" class="btn secondary link-btn">
          Open Timeline
        </a>
        <button id="open-export-modal" type="button" class="btn">Export Events</button>
      </div>
    </header>

    <section class="controls" aria-label="Event explorer filters">
      <div class="control-card">
        <h2>Filters</h2>
        <div class="control-grid">
          <label class="field-row" for="event-type-select">
            <span>Event Type</span>
            <select id="event-type-select" class="field-input">
              <option value="">All event types</option>
            </select>
          </label>

          <label class="field-row" for="date-since">
            <span>From</span>
            <input id="date-since" class="field-input" type="datetime-local" />
          </label>

          <label class="field-row" for="date-until">
            <span>To</span>
            <input id="date-until" class="field-input" type="datetime-local" />
          </label>
        </div>

        <div class="row">
          <button id="apply-filters" type="button" class="btn">Apply Filters</button>
          <button id="clear-filters" type="button" class="btn secondary">Clear Filters</button>
        </div>
      </div>
    </section>

    <section class="timeline-panel" aria-label="Events table">
      <div class="panel-head">
        <h2>Events</h2>
        <p id="events-summary" class="summary">Loading events...</p>
      </div>
      <div id="events-status" class="status" aria-live="polite"></div>

      <div class="table-wrap">
        <table class="event-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Type</th>
              <th>Ledger</th>
              <th>Event Index</th>
              <th>Transaction</th>
              <th>Payload</th>
            </tr>
          </thead>
          <tbody id="events-table-body"></tbody>
        </table>
      </div>

      <div class="pagination-row">
        <button id="previous-page" type="button" class="btn secondary">Previous</button>
        <span id="page-indicator" class="pill">Page 1</span>
        <button id="next-page" type="button" class="btn secondary">Next</button>
      </div>
    </section>
  </main>

  <script type="module" src="{% static 'ingest/event-explorer.js' %}"></script>
</body>
</html>
