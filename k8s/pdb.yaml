apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: soroscan-backend-pdb
  namespace: soroscan
  labels:
    app: soroscan
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: soroscan
      component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: soroscan-worker-high-pdb
  namespace: soroscan
  labels:
    app: soroscan
    component: worker-high
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: soroscan
      component: worker-high
