apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # Documentation of Routes:
    # The root route groups alerts by alertname and service.
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-webhook'

    receivers:
      - name: 'default-webhook'
        webhook_configs:
          - url: 'http://webhook-receiver.monitoring.svc.cluster.local:8080/alerts'
            send_resolved: true