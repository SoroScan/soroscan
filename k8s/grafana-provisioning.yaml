    \          \"expr\": \"sum(rate(soroscan_celery_tasks_total{job=~\\\"$job\\\"\
    ,instance=~\\\"$instance\\\"}[5m])) by (status,task_name)\",\n          \"legendFormat\"\
    : \"{{status}} {{task_name}}\"\n        }\n      ]\n    },\n    {\n      \"id\"\
