# Grafana Provisioning Configuration for SoroScan
# - Datasource: Prometheus at http://soroscan-prometheus.soroscan.svc:9090
# - Dashboard Provider: Auto-loads packaged JSON dashboards into /var/lib/grafana/dashboards/soroscan

apiVersion: v1
kind: ConfigMap
metadata:
  name: soroscan-grafana-datasources
  namespace: soroscan
  labels:
    app: soroscan
    component: grafana
data:
  datasources.yaml: "apiVersion: 1\n\ndatasources:\n  - name: Prometheus\n    type:\
    \ prometheus\n    access: proxy\n    url: http://soroscan-prometheus.soroscan.svc:9090\n\
    \    isDefault: true\n    editable: false\n    jsonData:\n      timeInterval:\
    \ '15s'\n      httpMethod: 'POST'\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soroscan-grafana-dashboards-provider
  namespace: soroscan
  labels:
    app: soroscan
    component: grafana
data:
  dashboards.yaml: "apiVersion: 1\n\nproviders:\n  - name: 'SoroScan Dashboards'\n\
    \    orgId: 1\n    folder: 'SoroScan'\n    type: file\n    disableDeletion: false\n\
    \    updateIntervalSeconds: 30\n    allowUiUpdates: true\n    options:\n     \
    \ path: /var/lib/grafana/dashboards/soroscan\n      foldersFromFilesStructure:\
    \ false\n"
---
apiVersion: v1
