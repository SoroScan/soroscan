# HorizontalPodAutoscalers for the backend and Celery workers.
# Requires metrics-server. Utilization targets are a percentage of each
# container's CPU request (see backend-deployment.yaml / worker-deployment.yaml).
# The deployments omit spec.replicas so re-applying them does not reset the
# replica count chosen by the HPA; minReplicas sets the initial size.
#
# | Target                   | Min | Max | CPU target |
# | ------------------------ | --- | --- | ---------- |
# | soroscan-backend         | 2   | 10  | 70%        |
# | soroscan-worker-high     | 1   | 8   | 75%        |
# | soroscan-worker-default  | 1   | 6   | 75%        |
# | soroscan-worker-low      | 1   | 4   | 75%        |
# | soroscan-worker-backfill | 1   | 3   | 75%        |
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soroscan-backend-hpa
  namespace: soroscan
  labels:
    app: soroscan
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soroscan-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
