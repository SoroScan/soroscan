apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soroscan.fullname" . }}-backend
  labels:
    {{- include "soroscan.labels" . | nindent 4 }}
    component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "soroscan.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "soroscan.labels" . | nindent 8 }}
        component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "soroscan.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "soroscan.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          workingDir: /app
          envFrom:
            - configMapRef:
                name: {{ include "soroscan.configMapName" . }}
            - secretRef:
                name: {{ include "soroscan.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: collectstatic
          image: {{ include "soroscan.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          workingDir: /app
          envFrom:
            - configMapRef:
                name: {{ include "soroscan.configMapName" . }}
            - secretRef:
                name: {{ include "soroscan.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: backend
          image: {{ include "soroscan.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - gunicorn
            - soroscan.wsgi:application
            - --bind
            - "0.0.0.0:8000"
            - --workers
            - {{ .Values.config.WEB_CONCURRENCY | default "4" | quote }}
            - --timeout
            - "120"
            - --graceful-timeout
            - "30"
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
          workingDir: /app
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "soroscan.configMapName" . }}
            - secretRef:
                name: {{ include "soroscan.secretName" . }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            successThreshold: 1
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            successThreshold: 1
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
