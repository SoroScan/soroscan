apiVersion: v1
kind: Service
metadata:
  name: {{ include "soroscan.fullname" . }}-backend
  labels:
    {{- include "soroscan.labels" . | nindent 4 }}
    component: backend
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "soroscan.selectorLabels" . | nindent 4 }}
    component: backend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  sessionAffinity: None
