name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'soroscan-frontend/**'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: soroscan-frontend

      - name: Build
        run: pnpm run build
        working-directory: soroscan-frontend

      - name: Assemble standalone server
        # public/ and .next/static aren't included in the standalone output
        # by `next build` itself — see Dockerfile.frontend's COPY steps,
        # which this mirrors.
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
        working-directory: soroscan-frontend

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun
        working-directory: soroscan-frontend
