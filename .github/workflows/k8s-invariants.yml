name: Kubernetes Manifest Invariants

on:
  push:
    branches: [main, dev]
    paths:
      - "k8s/**"
      - "tests/test_k8s_manifests.py"
      - ".github/workflows/k8s-invariants.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "k8s/**"
      - "tests/test_k8s_manifests.py"
      - ".github/workflows/k8s-invariants.yml"

jobs:
  test-invariants:
    name: Assert k8s manifest invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest PyYAML

      - name: Run Kubernetes manifest invariant tests
        run: python -m pytest tests/test_k8s_manifests.py -v
