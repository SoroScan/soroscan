name: Coverage — Aggregate & Report

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel redundant runs when a new commit is pushed on the same branch/PR
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Django / Python backend
  # ─────────────────────────────────────────────────────────────────────────────
  backend-coverage:
    name: Backend Coverage (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_soroscan
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: django-backend/requirements.txt

      - name: Install dependencies
        working-directory: django-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests + coverage
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_soroscan
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-only-secret-key
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: soroscan.settings_test
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python -m pytest \
            --cov=soroscan \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --cov-config=.coveragerc

      - name: Upload backend HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-html
          path: django-backend/htmlcov/
          retention-days: 30

      - name: Upload backend XML to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./django-backend/coverage.xml
          flags: backend
          name: backend
          fail_ci_if_error: true

      # Persist JSON summary for the combined-report job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend-json
          path: django-backend/coverage.json

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Next.js frontend
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-coverage:
    name: Frontend Coverage (Next.js / Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('soroscan-frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: soroscan-frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: soroscan-frontend
        run: pnpm run test:ci

      - name: Upload frontend HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-html
          path: soroscan-frontend/coverage/
          retention-days: 30

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./soroscan-frontend/coverage/lcov.info
          flags: frontend
          name: frontend
          fail_ci_if_error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend-json
          path: soroscan-frontend/coverage/coverage-summary.json

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. TypeScript SDK (Vitest)
  # ─────────────────────────────────────────────────────────────────────────────
  sdk-coverage:
    name: SDK Coverage (TypeScript / Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run tests with coverage
        working-directory: sdk/typescript
        run: npm run test:ci

      - name: Upload SDK coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sdk-html
          path: sdk/typescript/coverage/
          retention-days: 30

      - name: Upload SDK coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sdk/typescript/coverage/lcov.info
          flags: sdk
          name: sdk
          fail_ci_if_error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-sdk-json
          path: sdk/typescript/coverage/coverage-summary.json

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Combined PR comment — coverage summary table
  # ─────────────────────────────────────────────────────────────────────────────
  coverage-comment:
    name: Post Coverage Summary Comment
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage, sdk-coverage]
    if: github.event_name == 'pull_request' && always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage summaries
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*-json
          merge-multiple: true
          path: ./coverage-summaries

      - name: Generate combined coverage table
        id: coverage-table
        run: |
          python3 - <<'PYEOF'
          import json, os, glob

          def pct(data, key):
              try:
                  t = data["total"][key]
                  return f"{t['pct']:.1f}%"
              except Exception:
                  return "N/A"

          def load_json(path):
              with open(path) as f:
                  return json.load(f)

          rows = []
          summaries = glob.glob("coverage-summaries/**/*.json", recursive=True)

          # Try to identify which summary belongs to which component
          component_map = {
              "coverage.json": ("🐍 Backend", 80),     # Django JSON has different structure
              "coverage-summary.json": None,            # shared name – use directory
          }

          for s in summaries:
              name = os.path.basename(s)
              parent = os.path.basename(os.path.dirname(s))

              try:
                  data = load_json(s)
                  # Django coverage.json uses {"totals": {...}} format
                  if "totals" in data:
                      t = data["totals"]
                      pct_line = f"{t.get('percent_covered', 0):.1f}%"
                      pct_branch = f"{t.get('percent_covered_display', 'N/A')}"
                      rows.append(("🐍 Backend (Django)", pct_line, "80%", "✅" if float(t.get('percent_covered', 0)) >= 80 else "❌"))
                  elif "total" in data:
                      # Jest/Vitest coverage-summary.json
                      lines = pct(data, "lines")
                      branches = pct(data, "branches")
                      line_val = float(data["total"]["lines"]["pct"])
                      if "frontend" in s:
                          rows.append(("⚛️ Frontend (Next.js)", lines, "70%", "✅" if line_val >= 70 else "❌"))
                      elif "sdk" in s:
                          rows.append(("📦 SDK (TypeScript)", lines, "80%", "✅" if line_val >= 80 else "❌"))
              except Exception as e:
                  print(f"Warning: could not parse {s}: {e}")

          table = "| Component | Lines | Threshold | Status |\n"
          table += "|-----------|-------|-----------|--------|\n"
          for row in rows:
              table += f"| {row[0]} | {row[1]} | {row[2]} | {row[3]} |\n"

          if not rows:
              table += "| _No coverage data found_ | — | — | — |\n"

          output = f"## 📊 Coverage Report\n\n{table}\n\n> _Generated by the Coverage workflow. View full reports in the [Actions artifacts](https://github.com/${{{{ github.repository }}}}/actions/runs/${{{{ github.run_id }}}})._"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("COVERAGE_COMMENT<<EOF\n")
              f.write(output)
              f.write("\nEOF\n")
          print(output)
          PYEOF

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          message: ${{ env.COVERAGE_COMMENT }}
