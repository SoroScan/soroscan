name: Django Backend CI

# Canonical Django backend test workflow.
#
# NOTE: This workflow consolidates the former `django.yml` and `django-tests.yml`
# workflows into a single source of truth (see issue #1678). The two legacy
# workflows ran overlapping test jobs with conflicting coverage gates
# (--cov-fail-under=70 vs --cov-fail-under=80). This workflow standardizes on a
# single, documented coverage threshold (see COVERAGE_THRESHOLD below).
#
# Coverage threshold: 80%
# ----------------------
# The previous `django-tests.yml` enforced 80% and included the migration-check
# and migration-rollback jobs, while `django.yml` enforced only 70%. We adopt the
# stricter 80% threshold as the canonical gate. If coverage drops below 80%, CI
# fails and the gap must be closed (or the threshold revisited via a new ADR)
# rather than silently lowering it.

on:
  push:
    branches: [main, dev]
    paths:
      - 'django-backend/**'
      - '.github/workflows/django.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'django-backend/**'
      - '.github/workflows/django.yml'

jobs:
  test:
    name: Tests & coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_soroscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'django-backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./django-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check for missing Django migrations
        working-directory: ./django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_soroscan
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: soroscan.settings_test
          CELERY_TASK_ALWAYS_EAGER: 'True'
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOROSCAN_CONTRACT_ID: CCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          WEBHOOK_DELIVERY_RETENTION_DAYS: "30"
          LOG_FORMAT: ""
          SENTRY_DSN: ""
        run: python manage.py makemigrations --check --dry-run

      - name: Run pytest with coverage
        working-directory: ./django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_soroscan
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: soroscan.settings_test
          CELERY_TASK_ALWAYS_EAGER: 'True'
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOROSCAN_CONTRACT_ID: CCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          WEBHOOK_DELIVERY_RETENTION_DAYS: "30"
          LOG_FORMAT: ""
          SENTRY_DSN: ""
        # Single canonical coverage threshold (see header comment). Issue #1678.
        run: |
          python -m pytest \
            --cov=soroscan \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=json \
            --cov-fail-under=80

      - name: Lint with ruff
        working-directory: ./django-backend
        run: python -m ruff check .

      - name: Upload HTML coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: django-backend/htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./django-backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  migration-rollbacks:
    name: Migration rollback tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_soroscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'django-backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./django-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run migration forward/rollback harness
        working-directory: ./django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_soroscan
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: soroscan.settings_test
          CELERY_TASK_ALWAYS_EAGER: 'True'
        run: python -m pytest -m migration -v
