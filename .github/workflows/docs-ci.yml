name: Docs CI

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "soroscan-docs/**"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "soroscan-docs/**"
      - ".github/workflows/docs-ci.yml"

jobs:
  docs:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: soroscan-docs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build