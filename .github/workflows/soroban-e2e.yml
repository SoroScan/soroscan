name: Soroban E2E Integration

on:
  push:
    branches: [main]
    paths:
      - "django-backend/**"
      - "soroban-contracts/**"
      - "scripts/soroban-e2e-setup.sh"
      - ".github/workflows/soroban-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "django-backend/**"
      - "soroban-contracts/**"
      - "scripts/soroban-e2e-setup.sh"
      - ".github/workflows/soroban-e2e.yml"

jobs:
  soroban-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
      HORIZON_URL: http://localhost:8000
      STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      SOROBAN_E2E: "1"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_soroscan_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Start stellar/quickstart standalone (Soroban RPC)
        run: |
          docker run -d --name stellar-quickstart \
            -p 8000:8000 \
            --health-cmd="curl -sf http://localhost:8000/health || exit 1" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=30 \
            stellar/quickstart:testing \
            --standalone --enable-soroban-rpc
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "quickstart is healthy"
              exit 0
            fi
            sleep 3
          done
          docker logs stellar-quickstart
          exit 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            soroban-contracts/soroscan_core/target
          key: ${{ runner.os }}-soroban-e2e-cargo-${{ hashFiles('soroban-contracts/soroscan_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-soroban-e2e-cargo-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Deploy contract and emit live events
        run: bash scripts/soroban-e2e-setup.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: django-backend/requirements.txt

      - name: Install backend dependencies
        working-directory: django-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_soroscan_e2e
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-soroban-e2e
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: soroscan.settings_test
          CELERY_TASK_ALWAYS_EAGER: "True"
          SOROSCAN_CONTRACT_ID: ${{ env.SOROSCAN_CONTRACT_ID }}
        run: python manage.py migrate --noinput

      - name: Run Soroban e2e integration test
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_soroscan_e2e
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-soroban-e2e
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: soroscan.settings_test
          CELERY_TASK_ALWAYS_EAGER: "True"
          SOROBAN_E2E: "1"
          SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
          STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          SOROSCAN_CONTRACT_ID: ${{ env.SOROSCAN_CONTRACT_ID }}
        run: |
          export SOROSCAN_CONTRACT_ID="$(cat ../.soroban-e2e-contract-id)"
          python -m pytest soroscan/ingest/tests/test_soroban_e2e.py -v --no-cov

      - name: Stop quickstart container
        if: always()
        run: docker rm -f stellar-quickstart || true
