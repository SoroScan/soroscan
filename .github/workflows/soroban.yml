name: Soroban Contract CI

on:
  push:
    branches: [main]
    paths:
      - 'soroban-contracts/**'
      - '.github/workflows/soroban.yml'
  pull_request:
    branches: [main]
    paths:
      - 'soroban-contracts/**'
      - '.github/workflows/soroban.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            soroban-contracts/soroscan_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Check formatting
        working-directory: ./soroban-contracts/soroscan_core
        run: cargo fmt -- --check
      
      - name: Run clippy
        working-directory: ./soroban-contracts/soroscan_core
        run: cargo clippy --all-targets -- -D warnings
      
      - name: Run tests
        working-directory: ./soroban-contracts/soroscan_core
        run: cargo test

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage with tarpaulin
        working-directory: ./soroban-contracts/soroscan_core
        env:
          COVERAGE_THRESHOLD: "70"
        run: |
          mkdir -p coverage
          cargo tarpaulin \
            --verbose \
            --all-features \
            --workspace \
            --timeout 120 \
            --skip-clean \
            --exclude-files "*/target/*" \
            --out Xml \
            --out Lcov \
            --output-dir coverage/ \
            -- --test-threads=1

      - name: Enforce coverage threshold (≥ 70%)
        working-directory: ./soroban-contracts/soroscan_core
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("coverage/cobertura.xml")
          root = tree.getroot()
          rate = float(root.attrib.get("line-rate", 0)) * 100
          print(f"Contract coverage: {rate:.2f}%")
          if rate < 70:
              print(f"ERROR: coverage {rate:.2f}% is below the 70% threshold")
              sys.exit(1)
          print("Coverage threshold met.")
          EOF

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./soroban-contracts/soroscan_core/coverage/lcov.info
          flags: contracts
          name: contracts-coverage
          fail_ci_if_error: true
          verbose: true

      - name: Build WASM contract
        working-directory: ./soroban-contracts/soroscan_core
        run: |
          cargo build --target wasm32-unknown-unknown --release
      
      - name: Verify WASM artifact
        working-directory: ./soroban-contracts/soroscan_core
        run: |
          ls -lh target/wasm32-unknown-unknown/release/*.wasm
          file target/wasm32-unknown-unknown/release/*.wasm
      
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: soroscan-contract
          path: soroban-contracts/soroscan_core/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7
