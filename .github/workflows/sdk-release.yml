# Issue #133: Versioned Python SDK releases (tag-driven).
# Issue #1725: Versioned TypeScript SDK npm releases (tag-driven) & PR verification.
name: SDK Release

on:
  push:
    tags:
      - "sdk-python-v*"
      - "sdk-typescript-v*"
  pull_request:
    paths:
      - "sdk/typescript/**"
      - ".github/workflows/sdk-release.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish-python:
    name: Publish Python SDK to PyPI
    if: startsWith(github.ref, 'refs/tags/sdk-python-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install hatch

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#sdk-python-v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag sdk-python-v$TAG does not match pyproject.toml version $VER"
            exit 1
          fi

      - name: Verify GraphQL Codegen
        run: |
          cd ../typescript && npm ci && npm run generate
          cd ../python && pip install ariadne-codegen && ariadne-codegen
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Generated SDK types are out of sync with the schema. Run codegen locally and commit the changes."
            exit 1
          fi

      - name: Run tests
        run: pip install -e ".[dev]" && pytest -q

      - name: Build wheel and sdist
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  verify-typescript-pr:
    name: Verify TypeScript SDK build and dry-run packaging
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "sdk/typescript/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run linter and typecheck
        run: npm run lint

      - name: Build TypeScript SDK
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify dry-run packaging
        run: npm publish --dry-run

  publish-typescript:
    name: Publish TypeScript SDK to npm
    if: startsWith(github.ref, 'refs/tags/sdk-typescript-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#sdk-typescript-v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag sdk-typescript-v$TAG does not match package.json version $VER"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript SDK
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
