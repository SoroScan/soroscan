name: Admin Dashboard CI

on:
  push:
    branches: [main, dev]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"

permissions:
  contents: read

jobs:
  admin-ci:
    name: Lint, test, and build admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          CI: true

      - name: Build admin app
        run: npm run build
